name: cloudfuze-mft

# Local + on-prem stack. `docker compose up` brings the whole product up.
# For SaaS you would replace postgres/minio with managed services (RDS, S3) and
# supply the same environment variables.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mft
      POSTGRES_USER: mft
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mft}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Provisions the non-superuser runtime role (mft_app) on first init, so RLS is enforced.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mft -d mft"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for transferred file payloads (on-prem replacement for S3).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mftminio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-mftminio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Durable workflow engine. This is the dev server (ephemeral); production uses a real Temporal
  # cluster (or Temporal Cloud). Web UI on http://localhost:8233.
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --namespace default
    ports:
      - "7233:7233"
      - "8233:8233"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mft
      # Runtime = non-superuser (RLS enforced); migrations = admin owner.
      DB_USER: mft_app
      DB_PASSWORD: mft_app
      DB_ADMIN_URL: jdbc:postgresql://postgres:5432/mft
      DB_ADMIN_USER: mft
      DB_ADMIN_PASSWORD: ${DB_PASSWORD:-mft}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtcHJvZC0xMjM0NTY3OA==}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@cloudfuze.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe!2026}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:-mftminio}
      S3_SECRET_KEY: ${MINIO_PASSWORD:-mftminio123}
      S3_BUCKET: mft-files
      S3_PATH_STYLE: "true"
      TEMPORAL_TARGET: temporal:7233
      # In compose the frontend (served from :3000) is the browser origin that calls the API.
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # TLS terminator (opt-in: `docker compose --profile tls up`). Run deploy/tls/gen-cert.sh first.
  # In managed prod this role is an ALB/Ingress with a CA-issued cert; this is the reference edge.
  tls-proxy:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    depends_on:
      - frontend
      - backend
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/tls/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./deploy/tls/server.key:/etc/nginx/tls/server.key:ro

volumes:
  pgdata:
  miniodata:
